<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-label="scoring.svg"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e2443"/><stop offset="1" stop-color="#123c58"/></linearGradient></defs><rect width="100%" height="100%" rx="24" fill="url(#bg)"/><text x="36" y="57" fill="white" font-size="29" font-family="Arial" font-weight="bold">How Nexora prioritizes customers</text><rect x="40" y="110" width="290" height="110" rx="15" fill="#173756" stroke="#a78bfa" stroke-width="1.8"/><text x="58" y="149" fill="#f8fafc" font-size="20" font-family="Arial" font-weight="bold">Churn probability</text><text x="58" y="180" fill="#b6cadf" font-size="15" font-family="Arial">Model estimate: e.g. 0.70</text><text x="348" y="178" fill="#f8fafc" font-size="30" font-family="Arial">×</text><rect x="390" y="110" width="290" height="110" rx="15" fill="#173756" stroke="#38bdf8" stroke-width="1.8"/><text x="408" y="149" fill="#f8fafc" font-size="20" font-family="Arial" font-weight="bold">Monthly revenue</text><text x="408" y="180" fill="#b6cadf" font-size="15" font-family="Arial">Example: $200</text><text x="700" y="178" fill="#f8fafc" font-size="30" font-family="Arial">=</text><rect x="740" y="110" width="330" height="110" rx="15" fill="#173756" stroke="#34d399" stroke-width="1.8"/><text x="758" y="149" fill="#f8fafc" font-size="20" font-family="Arial" font-weight="bold">Expected exposure</text><text x="758" y="180" fill="#b6cadf" font-size="15" font-family="Arial">0.70 × $200 = $140</text><text x="40" y="291" fill="#b6cadf" font-size="17" font-family="Arial">An estimate for prioritization — not guaranteed losses or recovered revenue.</text></svg>